<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sorry na lablab</title>

    <link rel="stylesheet" href="love.css">
</head>
<body>

    

    <!-- Floating hearts will appear here -->
    <div id="hearts" aria-hidden="true"></div>

    <main class="container">

        <p class="small-title">I love youuuuu</p>

        <h1>To My Special na Special Baby</h1>

        <p class="subtitle">
            Happy Anniversaryyyyy
        </p>

        <!-- Envelope -->
        <div class="envelope" id="envelope">

            <div class="letter" id="letter">
                <div class="letter-content">

                    <p class="letter-label">A LETTER SAAK KINAKASING KASING</p>

                    <h2>To my sugarplumplum</h2>

                    <p id="message" aria-live="polite"></p>

                    <p class="signature" id="signature"></p>

                </div>
            </div>

            <div class="envelope-back"></div>

            <div class="flap" id="flap"></div>

            <div class="envelope-front"></div>

            <div class="seal" id="seal">♥</div>

        </div>

        <!-- Controls -->
        <button id="openBtn" type="button">
            Open ang mahiwagang Pagmamahal ko
        </button>

        <button id="restartBtn" type="button" hidden>
            Basaha Utro
        </button>

        <p class="hint" id="hint">
            Sarry ini ray kaya
        </p>

        <footer>
            <span>♡</span> Just for you <span>♡</span>
        </footer>

    </main>

    <script src="love.js"></script>

</body>
</html>
